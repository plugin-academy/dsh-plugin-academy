name: Publish npm package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version in package.json (without a leading v)
        required: true
        type: string
permissions: {}
concurrency:
  group: publish-npm
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require main in the Plugin Academy repository
        run: |
          if [[ "$GITHUB_REPOSITORY" != plugin-academy/dsh-plugin-academy || "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run this workflow from main in plugin-academy/dsh-plugin-academy."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=24.11.0 <25'
      - name: Confirm the package name and release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.equal(name, '@plugin-academy/dsh-plugin-academy')
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'Only stable npm versions are published by this workflow.')
          assert.equal(process.env.RELEASE_VERSION, version, 'The requested version must match package.json.')
          JS
      - run: npm ci
      - run: npm run validate && npm test
      - name: Check the public catalog and Featured index
        run: node scripts/check-live-catalog.mjs
      - name: Build and verify the npm tarball
        env:
          NPM_PACK_DESTINATION: ${{ runner.temp }}/npm
        run: |
          mkdir -p "$NPM_PACK_DESTINATION"
          npm run test:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm/plugin-academy-dsh-plugin-academy-${{ inputs.version }}.tgz
          if-no-files-found: error
          overwrite: true
  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=24.11.0 <25' # Bundles npm 11.6.1 or later for Trusted Publishing.
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm
      - name: Publish the verified tarball to npm
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm publish "$RUNNER_TEMP/npm/plugin-academy-dsh-plugin-academy-$RELEASE_VERSION.tgz" --registry=https://registry.npmjs.org --access=public --ignore-scripts
