name: Validate and package DSH publication
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate && npm test && npm run validate:remote && npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-academy-${{ github.sha }}
          path: dist/
          include-hidden-files: true
